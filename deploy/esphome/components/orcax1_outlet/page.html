<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrcaX1 · Printer power</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='9' width='12' height='5' fill='%23009688'/%3E%3Cpath d='M5 9V3h6v6' fill='none' stroke='%23009688' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root { --bg: #f4f5f7; --panel: #fff; --border: #d9dce3; --text: #1d2129; --muted: #69707d; --accent: #009688; --danger: #d64545; --warn: #c98a00; --ok: #2e9d57; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #17191d; --panel: #1f2227; --border: #353a43; --text: #e4e7ec; --muted: #949aa6; --accent: #1fb3a3; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: min(380px, 100%); display: grid; gap: 12px; }
.brand { font-size: 20px; font-weight: 700; text-align: center; }
.brand span { color: var(--accent); }
.row, .line { display: flex; align-items: center; gap: 8px; }
.title { flex: 1; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.error { color: var(--danger); }
.warning { color: var(--warn); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; }
.dot.on { background: var(--ok); }
.watts { margin-left: auto; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.spinner { display: inline-block; flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
button.switch { position: relative; flex: 0 0 auto; width: 40px; height: 22px; padding: 0; border-radius: 11px; border: 1px solid var(--border); background: var(--border); cursor: pointer; transition: background 0.15s, border-color 0.15s; }
button.switch.on { background: var(--accent); border-color: var(--accent); }
button.switch:disabled { opacity: 0.5; cursor: default; }
button.switch.pending { opacity: 1; cursor: progress; }
button.switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; transition: left 0.15s; box-shadow: 0 1px 2px rgb(0 0 0 / 0.3); }
button.switch.on .knob { left: 20px; }
button.switch .knob .spinner { width: 12px; height: 12px; }
a { color: var(--accent); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">Orca<span>X1</span></div>
  <div class="row">
    <div class="title">Printer power</div>
    <button class="switch" id="sw" role="switch" aria-checked="false" disabled><span class="knob"></span></button>
  </div>
  <div class="line" id="status"><span class="spinner"></span><span class="muted">Connecting…</span></div>
  <div class="warning small" id="link" hidden>This device has lost its connection to Home Assistant: the values may be stale and switching won't work.</div>
  <div class="error small" id="err" hidden></div>
  <div class="line muted" id="wait" hidden><span class="spinner"></span><span id="waittext"></span></div>
  <div class="muted small" id="hint"></div>
</main>
<script>
'use strict'
// Polls this device for the outlet state. It can only switch the printer
// ON: switching off needs an OrcaX1 login (orcax1d holds the token for it).
const $ = (id) => document.getElementById(id)
// Sent here by OrcaX1 because the printer didn't answer: go back on our own once it does.
const handoff = new URLSearchParams(location.search).has('from')
const PENDING_TIMEOUT_MS = 20000
let st = null
let online = false
let pending = false
let pendingTimer = null
let printerUp = false
let onSince = null

const fmtWatts = (w) => w === null ? '— W' : w >= 100 ? `${Math.round(w)} W` : `${w.toFixed(1)} W`

function setPending(v) {
  clearTimeout(pendingTimer)
  pending = v
  if (v) pendingTimer = setTimeout(() => { pending = false; render() }, PENDING_TIMEOUT_MS)
}

function render() {
  const on = st ? st.on : null
  const sw = $('sw')
  sw.classList.toggle('on', on === true)
  sw.classList.toggle('pending', pending)
  sw.setAttribute('aria-checked', String(on === true))
  sw.disabled = !online || on !== false || pending || st.linked === false
  sw.querySelector('.knob').innerHTML = pending ? '<span class="spinner"></span>' : ''
  sw.title = on ? 'Switch it off in OrcaX1 (needs signing in)' : 'Turn the printer on'

  const status = $('status')
  if (!online) {
    status.innerHTML = '<span class="spinner"></span><span class="muted">Connecting…</span>'
  } else {
    status.innerHTML = ''
    const dot = document.createElement('span')
    dot.className = `dot${on ? ' on' : ''}`
    const text = document.createElement('span')
    text.textContent = pending ? 'Turning on…' : on === null ? 'Unknown' : on ? 'On' : 'Off'
    const watts = document.createElement('span')
    watts.className = 'watts'
    watts.textContent = fmtWatts(st.power)
    status.append(dot, text, watts)
  }
  $('link').hidden = !st || st.linked !== false

  const waiting = on === true && !printerUp
  $('wait').hidden = !waiting && !printerUp
  if (printerUp) {
    $('waittext').textContent = handoff ? 'The printer is up. Opening OrcaX1…' : 'The printer is up.'
  } else if (waiting && onSince !== null) {
    const s = Math.max(0, Math.round((Date.now() - onSince) / 1000))
    $('waittext').textContent = `Waiting for the printer to start (${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')})…`
  }

  const hint = $('hint')
  hint.textContent = ''
  if (st) {
    if (on === false && !printerUp) hint.append(handoff ? 'The printer is off. Switch it on and OrcaX1 opens as soon as the printer is up.' : 'The printer is off.')
    if (on === true) hint.append('To switch it off, use OrcaX1 (after signing in).')
    if (printerUp || !handoff) {
      if (hint.textContent) hint.append(' ')
      const a = document.createElement('a')
      a.href = `${st.printer}/`
      a.textContent = 'Open OrcaX1'
      hint.append(a)
    }
  }
}

function showError(msg) {
  $('err').hidden = !msg
  $('err').textContent = msg || ''
}

function apply(next) {
  if (st && next.on !== st.on) {
    onSince = next.on ? Date.now() : null
    if (next.on) setPending(false)
  } else if (!st && next.on) {
    onSince = Date.now()
  }
  st = next
  online = true
}

async function poll() {
  try {
    const res = await fetch('/orcax1/state', { cache: 'no-store', signal: AbortSignal.timeout(4000) })
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
    apply(await res.json())
    if (!printerChecking) checkPrinter()
  } catch {
    online = false
  }
  render()
  setTimeout(poll, 1000)
}

$('sw').addEventListener('click', async () => {
  if (!st || st.on !== false) return
  showError(null)
  setPending(true)
  render()
  try {
    const res = await fetch('/orcax1/on', { method: 'POST' })
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.error || `${res.status} ${res.statusText}`)
    }
  } catch (e) {
    setPending(false)
    showError(`Switching on failed: ${e.message || e}`)
    render()
  }
})

// orcax1d answers /api/alive to any origin. A self-signed printer
// certificate works as long as this browser has accepted it before.
let printerChecking = false
async function checkPrinter() {
  printerChecking = true
  try {
    const res = await fetch(`${st.printer}/api/alive`, { cache: 'no-store', signal: AbortSignal.timeout(4000) })
    if (res.ok) {
      printerUp = true
      render()
      if (handoff) {
        location.replace(`${st.printer}/`)
        return
      }
    } else {
      printerUp = false
    }
  } catch {
    printerUp = false
  }
  render()
  setTimeout(checkPrinter, 3000)
}

poll()
</script>
</body>
</html>
