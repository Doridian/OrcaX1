name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache engine and Orca profiles source
        uses: actions/cache@v6
        with:
          path: |
            web/public/engine
            build/orca-src
          key: engine-${{ hashFiles('scripts/fetch-engine.sh', 'scripts/build-profiles.mjs') }}

      - name: Fetch WASM engine
        run: ./scripts/fetch-engine.sh

      - name: Build profiles
        run: node scripts/build-profiles.mjs

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: orcax1-www
          path: web/dist
          if-no-files-found: error

  daemon:
    name: Daemon (armv7 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            build/cargo-registry
            daemon/target/cross
          key: daemon-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: daemon-

      - name: Cross-build orcax1d
        env:
          CONTAINER_ENGINE: docker
        run: ./scripts/build-daemon.sh

      - uses: actions/upload-artifact@v7
        with:
          name: orcax1d-armv7
          path: dist/orcax1d-armv7
          if-no-files-found: error

  package:
    name: Package
    needs: [web, daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: orcax1-www
          path: web/dist

      - uses: actions/download-artifact@v8
        with:
          name: orcax1d-armv7
          path: dist

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$GITHUB_REF_NAME
          else
            version=dev-${GITHUB_SHA::7}
          fi
          ./scripts/package.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: orcax1-${{ steps.package.outputs.version }}
          path: dist/orcax1-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum "orcax1-$TAG.zip" > SHA256SUMS)
          assets=("dist/orcax1-$TAG.zip" dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --verify-tag \
              --notes-file deploy/RELEASE_NOTES.md --generate-notes
          fi
